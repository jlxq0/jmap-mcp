services:
  jmap-mcp:
    image: ghcr.io/jlxq0/jmap-mcp:0.2.10
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
