name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/jlxq0/jmap-mcp

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$tag_version" = "$cargo_version"

      - name: OSV dependency audit
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          scan-args: |-
            --lockfile=./Cargo.lock

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          artifact-name: jmap-mcp-${{ github.ref_name }}.spdx.json
          output-file: jmap-mcp-${{ github.ref_name }}.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Sign image by immutable digest
        shell: bash
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="release-notes.md"
          awk -v heading="## ${version} " '
            index($0, heading) == 1 { in_release=1; next }
            in_release && /^## / { exit }
            in_release { print }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            "jmap-mcp-${GITHUB_REF_NAME}.spdx.json" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file"
