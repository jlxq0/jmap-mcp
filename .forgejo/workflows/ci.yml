name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # All cargo checks in one job — cache hit + shared incremental state beats
  # one-job-per-check. jmap-mcp has no C deps, so no cmake/apt step.
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      # Actions resolve against forge.oddie.app, NOT github.com — the runner
      # rewrites `owner/repo` to this Forge's mirror. A SHA that exists on
      # GitHub but has not been mirrored here fails the job in ~1s with
      # "could not determine the commit ID", before any step runs, which reads
      # as a container-setup failure rather than a bad pin. This SHA must
      # therefore be one present in the *mirror*; verify with
      #   curl -H "Authorization: token $T" \
      #     https://forge.oddie.app/api/v1/repos/dtolnay/rust-toolchain/git/commits/<sha>
      # before changing it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit --version 0.22.1
          cargo audit
      - name: OSV dependency audit
        env:
          OSV_SCANNER_VERSION: 2.5.1
          OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          binary="/tmp/osv-scanner"
          curl -sSL -o "$binary" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${binary}" | sha256sum -c -
          chmod +x "$binary"
          "$binary" --lockfile=./Cargo.lock
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with: { command: check bans licenses sources }

  # buildctl talks to Pada's buildkitd over TCP. Registry-backed layer cache.
  docker:
    runs-on: ubuntu-22.04
    needs: cargo
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      - name: Install buildctl
        env:
          BUILDKIT_VERSION: v0.30.0
          BUILDKIT_SHA256: 2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d
        run: |
          set -euo pipefail
          TARBALL="/tmp/buildkit.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local --strip-components=0 -f "$TARBALL"
          rm -f "$TARBALL"
          buildctl --version
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          TARBALL="/tmp/trivy.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$TARBALL" trivy
          rm -f "$TARBALL"
          trivy --version
      - name: Scan source tree
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Login to Forgejo registry
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json
      - name: Build (and push on tag)
        run: |
          set -euo pipefail
          # buildkitd runs on the runner host, listening on 0.0.0.0:1234. From
          # inside this job container the host is our own bridge gateway — never
          # a hardcoded IP (those change on reboot/DHCP and differ per repo).
          # The image is slim (no iproute2), so read the default route from
          # /proc/net/route via node (always present — actions run on it).
          GW="$(node -e 'const fs=require("fs");for(const l of fs.readFileSync("/proc/net/route","utf8").split("\n").slice(1)){const f=l.trim().split(/\s+/);if(f[1]==="00000000"){const h=f[2];console.log([h.slice(6,8),h.slice(4,6),h.slice(2,4),h.slice(0,2)].map(x=>parseInt(x,16)).join("."));break;}}')"
          export BUILDKIT_HOST="tcp://${GW}:1234"
          echo "buildkitd at ${BUILDKIT_HOST}"
          CACHE_REF="forge.oddie.app/jlxq0/jmap-mcp:buildcache"
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          METADATA_FILE="/tmp/build-metadata.json"
          IMPORT_CACHE_ARG=()
          EXPORT_CACHE_ARG=()
          ATTEST_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            test "${V#v}" = "$VERSION"
            TAGS="forge.oddie.app/jlxq0/jmap-mcp:${V},forge.oddie.app/jlxq0/jmap-mcp:latest"
            PUSH=true
            # Import only. A tag build is the same commit as the `main` build
            # that preceded it, so its cache would be byte-identical — and two
            # concurrent writers to one ref is what fails a run whose image is
            # already published. See the comment on the export below.
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
            ATTEST_ARGS=(--opt "attest:sbom=" --opt "attest:provenance=mode=max")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="forge.oddie.app/jlxq0/jmap-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
            # The only writer. Merging a PR and pushing the release tag are two
            # pushes, so two `docker` jobs run at once; both exporting to one
            # unqualified `:buildcache` ref made one of them lose the blob write
            # and fail with `error writing layer blob: unknown` — after the
            # image had already been pushed. One writer removes the race by
            # construction rather than by scheduling.
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          else
            TAGS="forge.oddie.app/jlxq0/jmap-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
          fi
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt platform=linux/amd64 \
            --opt "build-arg:APP_VERSION=${VERSION}" \
            --opt "build-arg:VCS_REF=${GITHUB_SHA}" \
            --metadata-file "$METADATA_FILE" \
            "${IMPORT_CACHE_ARG[@]}" \
            "${EXPORT_CACHE_ARG[@]}" \
            "${ATTEST_ARGS[@]}" \
            --output "type=image,\"name=${TAGS}\",push=${PUSH}"

          if [[ "$PUSH" == true ]]; then
            DIGEST="$(jq -r '."containerimage.digest"' "$METADATA_FILE")"
            test -n "$DIGEST" && test "$DIGEST" != null
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "forge.oddie.app/jlxq0/jmap-mcp@${DIGEST}"
          fi
